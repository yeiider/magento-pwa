services:
  app:
    image: webdevops/php-apache:8.2
    container_name: magento-app
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./:/app:rw,cached
    environment:
      WEB_DOCUMENT_ROOT: /app/pub
      PHP_MEMORY_LIMIT: 2G
      PHP_MAX_EXECUTION_TIME: 1800
      PHP_POST_MAX_SIZE: 64M
      PHP_UPLOAD_MAX_FILESIZE: 64M
      MAGENTO_BASE_URL: http://localhost:8088/
    depends_on:
      magento-setup:
        condition: service_completed_successfully
    networks:
      - public
      - internal

  magento-setup:
    image: webdevops/php-apache:8.2
    container_name: magento-setup
    restart: "no"
    volumes:
      - ./:/app:rw,cached
    environment:
      MAGENTO_BASE_URL: http://localhost:8088/
      MAGENTO_DB_HOST: db
      MAGENTO_DB_NAME: magento
      MAGENTO_DB_USER: magento
      MAGENTO_DB_PASSWORD: magento
      MAGENTO_ADMIN_FIRSTNAME: Admin
      MAGENTO_ADMIN_LASTNAME: User
      MAGENTO_ADMIN_EMAIL: admin@example.com
      MAGENTO_ADMIN_USER: admin
      MAGENTO_ADMIN_PASSWORD: Admin123!
      MAGENTO_ADMIN_FRONTNAME: admin
      MAGENTO_LANGUAGE: es_CO
      MAGENTO_CURRENCY: USD
      MAGENTO_TIMEZONE: America/Bogota
      MAGENTO_LOCALES: en_US es_ES es_CO
      MAGENTO_OPENSEARCH_HOST: opensearch
      MAGENTO_OPENSEARCH_PORT: 9200
    command: ["/bin/bash", "/app/docker/init-magento.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      opensearch:
        condition: service_started
    networks:
      - internal

  db:
    image: mysql:8.0
    container_name: magento-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: magento-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: magento-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: magento
      RABBITMQ_DEFAULT_PASS: magento
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: magento-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      plugins.security.disabled: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - internal

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  opensearch_data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true
